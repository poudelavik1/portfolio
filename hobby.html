          CV
        </a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <a class="back-link" href="index.html"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#i-chevron-left"></use></svg> Portfolio</a>
        <h1>Travel &amp; photography</h1>
        <p>Photos from treks, field work and trips around Nepal. Select any photo to see it full size.</p>
      </div>
    </section>

    <section class="section page-body">
      <div class="container">
        <div class="gallery">
          <figure class="gallery__item" id="abc">
            <button class="gallery__open" type="button" data-full="assets/img/travel/abc.jpg" data-title="Annapurna Base Camp" data-desc="Annapurna Base Camp trek">
              <img src="assets/img/travel/abc-sm.jpg" width="640" height="641" alt="Silhouette of a trekker in front of snow-covered Annapurna peaks">
            </button>
            <figcaption><h2>Annapurna Base Camp</h2><p>Annapurna Base Camp trek</p></figcaption>
          </figure>

          <figure class="gallery__item" id="cj">
            <button class="gallery__open" type="button" data-full="assets/img/travel/cj.jpg" data-title="Concrete jungle" data-desc="Kathmandu from Chandragiri Hills">
              <img src="assets/img/travel/cj-sm.jpg" width="760" height="507" alt="Kathmandu spread across the valley, seen from Chandragiri Hills, with a street lamp in the foreground">
            </button>
            <figcaption><h2>Concrete jungle</h2><p>Kathmandu from Chandragiri Hills</p></figcaption>
          </figure>

          <figure class="gallery__item" id="random">
            <button class="gallery__open" type="button" data-full="assets/img/travel/random.jpg" data-title="Random art" data-desc="Random art in the mountains">
              <img src="assets/img/travel/random-sm.jpg" width="760" height="665" loading="lazy" alt="A smiling face made of pebbles on a rock beside a mountain trail">
            </button>
            <figcaption><h2>Random art</h2><p>Random art in the mountains</p></figcaption>
          </figure>

          <figure class="gallery__item" id="goshainkunda">
            <button class="gallery__open" type="button" data-full="assets/img/travel/goshainkunda.jpg" data-title="Gosaikunda lake" data-desc="Gosaikunda, Rasuwa">
              <img src="assets/img/travel/goshainkunda-sm.jpg" width="760" height="570" loading="lazy" alt="Gosaikunda, a deep blue alpine lake surrounded by rocky mountains">
            </button>
            <figcaption><h2>Gosaikunda lake</h2><p>Gosaikunda, Rasuwa</p></figcaption>
          </figure>

          <figure class="gallery__item" id="sunrise">
            <button class="gallery__open" type="button" data-full="assets/img/travel/sunrise.jpg" data-title="Sunrise" data-desc="Khumaltar, Lalitpur">
              <img src="assets/img/travel/sunrise-sm.jpg" width="688" height="760" loading="lazy" alt="Orange sunrise under dark clouds over a green field, framed by trees">
            </button>
            <figcaption><h2>Sunrise</h2><p>Khumaltar, Lalitpur</p></figcaption>
          </figure>

          <figure class="gallery__item" id="tea">
            <button class="gallery__open" type="button" data-full="assets/img/travel/tea.jpg" data-title="Tea gardens" data-desc="Kanyam, Ilam">
              <img src="assets/img/travel/tea-sm.jpg" width="760" height="570" loading="lazy" alt="Rows of green tea bushes on a hillside in Kanyam, Ilam">
            </button>
            <figcaption><h2>Tea gardens</h2><p>Kanyam, Ilam</p></figcaption>
          </figure>

          <figure class="gallery__item" id="janaki">
            <button class="gallery__open" type="button" data-full="assets/img/travel/janaki.jpg" data-title="Janaki Temple" data-desc="Janakpur">
              <img src="assets/img/travel/janaki-sm.jpg" width="760" height="570" loading="lazy" alt="The white Janaki Temple in Janakpur, with visitors in the courtyard">
            </button>
            <figcaption><h2>Janaki Temple</h2><p>Janakpur</p></figcaption>
          </figure>

          <figure class="gallery__item" id="jarsing">
            <button class="gallery__open" type="button" data-full="assets/img/travel/jarsing.jpg" data-title="Gumba" data-desc="Jarsing Pauwa">
              <img src="assets/img/travel/jarsing-sm.jpg" width="760" height="570" loading="lazy" alt="A gumba (Buddhist monastery) half hidden in mist behind pine trees">
            </button>
            <figcaption><h2>Gumba</h2><p>Jarsing Pauwa</p></figcaption>
          </figure>

          <figure class="gallery__item" id="survey">
            <button class="gallery__open" type="button" data-full="assets/img/travel/survey.jpg" data-title="Irrigation survey" data-desc="Ghatte Khola irrigation survey, Shankharapur, Kathmandu">
              <img src="assets/img/travel/survey-sm.jpg" width="760" height="570" loading="lazy" alt="Surveying instrument on a tripod beside a stream in the forest">
            </button>
            <figcaption><h2>Irrigation survey</h2><p>Ghatte Khola irrigation survey, Shankharapur, Kathmandu</p></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <dialog class="lightbox" data-lightbox aria-label="Photo viewer">
    <div class="lightbox__inner">
      <img alt="">
      <p class="lightbox__caption"><strong data-lb-title></strong><span data-lb-desc></span></p>
    </div>
    <button class="lightbox__btn lightbox__close" type="button" data-lb-close aria-label="Close">
      <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#i-xmark"></use></svg>
    </button>
    <button class="lightbox__btn lightbox__prev" type="button" data-lb-prev aria-label="Previous photo">
      <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#i-chevron-left"></use></svg>
    </button>
    <button class="lightbox__btn lightbox__next" type="button" data-lb-next aria-label="Next photo">
      <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#i-chevron-right"></use></svg>
    </button>
  </dialog>

        <a href="resources/cv.pdf" download>CV</a>
      </nav>
    </div>
  </footer>

  <script src="assets/js/site.js" defer></script>
  <script src="assets/js/gallery.js" defer></script>
</body>
</html>
